<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR Studio</title>
<style>
:root{--bg:#0e0e11;--p:#17171c;--b:#2a2a33;--t:#ececf2;--m:#8e8ea2;--a:#8b7bff}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--t);font:13px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;display:flex;overflow:hidden}
#side{width:350px;flex:none;height:100%;overflow:auto;background:var(--p);border-right:1px solid var(--b);padding:0 14px 30px}
#hd{position:sticky;top:0;z-index:2;background:var(--p);padding:14px 0 10px;border-bottom:1px solid var(--b)}
#hd b{display:block;font-size:16px;margin-bottom:8px}#hd div{display:flex;gap:6px;flex-wrap:wrap}
#stage{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;position:relative;
 background:conic-gradient(#15151a 25%,#1a1a20 0 50%,#15151a 0 75%,#1a1a20 0) 0 0/24px 24px}
#view svg{display:block;border-radius:6px;box-shadow:0 12px 60px #000a}
#info{position:absolute;left:14px;bottom:10px;right:14px;color:var(--m);font-size:12px}
details{border-bottom:1px solid var(--b);padding:4px 0}summary{cursor:pointer;font-weight:600;padding:8px 0}
.r{display:flex;align-items:center;gap:8px;margin:7px 0}
.r label{flex:0 0 96px;color:var(--m)}.r input[type=range]{flex:1;min-width:0;accent-color:var(--a)}
.r output{width:42px;text-align:right;color:var(--m);font-variant-numeric:tabular-nums}
.r select,.r input[type=text],.r textarea{flex:1;min-width:0}
select,input[type=number],input[type=text],textarea,button{background:#22222a;color:var(--t);border:1px solid var(--b);border-radius:6px;padding:6px 9px;font:inherit}
button{cursor:pointer}button:hover,select:hover{border-color:var(--a)}
button.p{background:var(--a);border-color:var(--a);color:#fff}:focus-visible{outline:2px solid var(--a);outline-offset:1px}
.sw{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;align-items:center}
.sw span{position:relative}.sw input,.r input[type=color]{width:38px;height:34px;padding:0;border:0;background:none;cursor:pointer}
.sw b{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:#000c;color:#fff;font-size:11px;text-align:center;line-height:16px;cursor:pointer}
@media(max-width:780px){body{flex-direction:column-reverse}#side{width:100%;height:56%;border:0;border-top:1px solid var(--b)}#stage{height:44%}}
</style></head><body>
<div id="side"><div id="hd"><b>QR Studio</b><div><button class="p" id="ra">Randomize style</button><button class="p" id="dlb">Download</button></div></div></div>
<div id="stage"><div id="view"></div><div id="info"></div></div>
<script>
const $=s=>document.querySelector(s),rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.round(rnd(a,b)),pk=a=>a[Math.random()*a.length|0];
/*QR*/
const ECC=[[7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],[10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28],[13,22,18,26,18,24,18,22,20,24,28,26,24,20,30,24,28,28,26,30,28,30,30,30,30,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],[17,28,22,16,22,28,26,26,24,28,24,28,22,24,24,30,28,28,26,28,30,24,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30]];
const BLK=[[1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],[1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49],[1,1,2,2,4,4,6,6,8,8,8,10,12,16,12,17,16,18,21,20,23,23,25,27,29,34,34,35,38,40,43,45,48,51,53,56,59,62,65,68],[1,1,2,4,4,4,5,6,8,8,11,11,16,16,18,16,19,21,25,25,25,34,30,32,35,37,40,42,45,48,51,54,57,60,63,66,70,74,77,81]];
const ECL={L:0,M:1,Q:2,H:3},FB={L:1,M:0,Q:3,H:2};
function qr(text,L){
 const e=ECL[L],fb=FB[L],bytes=[...new TextEncoder().encode(text)];let v;
 const raw=v=>{let r=(16*v+128)*v+64;if(v>=2){const a=(v/7|0)+2;r-=(25*a-10)*a-55;if(v>=7)r-=36}return r};
 const dc=v=>(raw(v)>>3)-ECC[e][v-1]*BLK[e][v-1];
 for(v=1;;v++){if(v>40)throw 0;if(4+(v<10?8:16)+8*bytes.length<=dc(v)*8)break}
 const bits=[],put=(x,n)=>{for(let i=n-1;i>=0;i--)bits.push(x>>>i&1)};
 put(4,4);put(bytes.length,v<10?8:16);bytes.forEach(b=>put(b,8));
 const C=dc(v)*8;put(0,Math.min(4,C-bits.length));put(0,(8-bits.length%8)%8);
 for(let p=0xEC;bits.length<C;p^=0xEC^0x11)put(p,8);
 const data=[];for(let i=0;i<bits.length;i+=8)data.push(parseInt(bits.slice(i,i+8).join(''),2));
 const nb=BLK[e][v-1],el=ECC[e][v-1],rc=raw(v)>>3,ns=nb-rc%nb,sl=rc/nb|0;
 const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=z<<1^(z>>>7)*0x11D;z^=(y>>>i&1)*x}return z};
 const dv=Array(el-1).fill(0).concat(1);let r=1;
 for(let i=0;i<el;i++){for(let j=0;j<el;j++){dv[j]=mul(dv[j],r);if(j+1<el)dv[j]^=dv[j+1]}r=mul(r,2)}
 const rem=d=>{const o=Array(el).fill(0);for(const b of d){const f=b^o.shift();o.push(0);dv.forEach((c,i)=>o[i]^=mul(c,f))}return o};
 const blocks=[];for(let i=0,k=0;i<nb;i++){const d=data.slice(k,k+sl-el+(i<ns?0:1));k+=d.length;const ec=rem(d);if(i<ns)d.push(0);blocks.push(d.concat(ec))}
 const cw=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!=sl-el||j>=ns)cw.push(b[i])});
 const n=v*4+17,m=Array.from({length:n},()=>Array(n).fill(false)),f=Array.from({length:n},()=>Array(n).fill(false));
 const set=(x,y,d)=>{m[y][x]=d;f[y][x]=true};
 for(let i=0;i<n;i++){set(6,i,i%2==0);set(i,6,i%2==0)}
 for(const[cx,cy]of[[3,3],[n-4,3],[3,n-4]])for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),x=cx+dx,y=cy+dy;if(x>=0&&x<n&&y>=0&&y<n)set(x,y,d!=2&&d!=4)}
 const ap=[6];if(v==1)ap.length=0;else{const na=(v/7|0)+2,st=v==32?26:Math.ceil((v*4+4)/(na*2-2))*2;for(let p=n-7;ap.length<na;p-=st)ap.splice(1,0,p)}
 ap.forEach((a,i)=>ap.forEach((b,j)=>{if(i==0&&j==0||i==0&&j==ap.length-1||i==ap.length-1&&j==0)return;
  for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(a+dx,b+dy,Math.max(Math.abs(dx),Math.abs(dy))!=1)}));
 const fmt=k=>{const d=fb<<3|k;let r=d;for(let i=0;i<10;i++)r=r<<1^(r>>>9)*0x537;const b=(d<<10|r)^0x5412,g=i=>(b>>>i&1)==1;
  for(let i=0;i<=5;i++)set(8,i,g(i));set(8,7,g(6));set(8,8,g(7));set(7,8,g(8));for(let i=9;i<15;i++)set(14-i,8,g(i));
  for(let i=0;i<8;i++)set(n-1-i,8,g(i));for(let i=8;i<15;i++)set(8,n-15+i,g(i));set(8,n-8,true)};
 fmt(0);
 if(v>=7){let r=v;for(let i=0;i<12;i++)r=r<<1^(r>>>11)*0x1F25;const b=v<<12|r;for(let i=0;i<18;i++){const c=(b>>>i&1)==1,a=n-11+i%3,d=i/3|0;set(a,d,c);set(d,a,c)}}
 let i=0;for(let right=n-1;right>=1;right-=2){if(right==6)right=5;for(let vert=0;vert<n;vert++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)==0,y=up?n-1-vert:vert;
  if(!f[y][x]&&i<cw.length*8){m[y][x]=(cw[i>>>3]>>>7-(i&7)&1)==1;i++}}}
 const MK=[(x,y)=>(x+y)%2==0,(x,y)=>y%2==0,(x,y)=>x%3==0,(x,y)=>(x+y)%3==0,(x,y)=>((x/3|0)+(y>>1))%2==0,(x,y)=>x*y%2+x*y%3==0,(x,y)=>(x*y%2+x*y%3)%2==0,(x,y)=>((x+y)%2+x*y%3)%2==0];
 const mk=k=>{for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(!f[y][x]&&MK[k](x,y))m[y][x]=!m[y][x]};
 const pen=()=>{let p=0,d=0;for(let t=0;t<2;t++)for(let a=0;a<n;a++){let run=1;for(let b=1;b<n;b++){const c=t?m[b][a]:m[a][b],pc=t?m[b-1][a]:m[a][b-1];if(c==pc){run++;if(run==5)p+=3;else if(run>5)p++}else run=1}}
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){if(m[y][x])d++;if(x&&y&&m[y][x]==m[y][x-1]&&m[y][x]==m[y-1][x]&&m[y][x]==m[y-1][x-1])p+=3}
  return p+(Math.ceil(Math.abs(d*20-n*n*10)/(n*n))-1)*10};
 let best=0,bp=1e9;for(let k=0;k<8;k++){mk(k);fmt(k);const p=pen();if(p<bp){bp=p;best=k}mk(k)}
 mk(best);fmt(best);return{n,v,m}}
/*ENDQR*/

/* ---------- state ---------- */
const D={text:'https://example.com',ecc:'auto',quiet:3,shape:'liquid',msize:1,round:.8,rand:0,seed:1,eo:'rounded',ep:'rounded',er:.5,ecs:false,eoc:'#111111',epc:'#111111',
fgm:'linear',fg:['#1b1464','#7b3fe4'],fga:45,bgm:'solid',bg:['#ffffff'],bga:90,logo:'',ltext:'',lcol:'#111111',lsize:20,lpad:1,lshape:'rounded',lbg:'#ffffff',lclip:true,
brad:2,bw:0,bc:'#000000',cap:'',capSize:2,capCol:'#111111',px:1024,fmt:'png',q:92};
let S=JSON.parse(JSON.stringify(D));try{Object.assign(S,JSON.parse(localStorage.qrStudio))}catch(e){}

/* ---------- helpers ---------- */
function hsl(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));
 return'#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('')}
const lum=h=>{const c=[1,3,5].map(i=>{const x=parseInt(h.substr(i,2),16)/255;return x<=.03928?x/12.92:((x+.055)/1.055)**2.4});return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt()+';');
const rp=(x,y,w,h,r)=>{const[a,b,c,e]=r;return`M${x+a} ${y}H${x+w-b}A${b} ${b} 0 0 1 ${x+w} ${y+b}V${y+h-c}A${c} ${c} 0 0 1 ${x+w-c} ${y+h}H${x+e}A${e} ${e} 0 0 1 ${x} ${y+h-e}V${y+a}A${a} ${a} 0 0 1 ${x+a} ${y}Z`};
const poly=p=>'M'+p.map(q=>q[0]+' '+q[1]).join('L')+'Z';
const circ=(cx,cy,r)=>`M${cx-r} ${cy}a${r} ${r} 0 1 0 ${2*r} 0a${r} ${r} 0 1 0 ${-2*r} 0Z`;
function shp(t,x,y,w,r,sc){ /* eye shapes inside a w×w box */
 if(t==='diamond'){const h=w/2;return poly([[x+h,y],[x+w,y+h],[x+h,y+w],[x,y+h]])}
 if(t==='circle')return circ(x+w/2,y+w/2,w/2);
 let R=t==='square'?0:r*w/2;if(t==='leaf')R=w*(.25+r*.25);const a=[R,R,R,R];if(t==='leaf')a[sc]=0;return rp(x,y,w,w,a)}
const rn=i=>{const x=Math.sin(i*127.1+S.seed*311.7)*43758.5453;return x-Math.floor(x)};

/* ---------- SVG builder ---------- */
function build(){
 const L=S.ecc==='auto'?(S.logo||S.ltext?'H':'M'):S.ecc;let Q;try{Q=qr(S.text||' ',L)}catch(e){return null}
 const{n,m,v}=Q,q=S.quiet,T=n+2*q,cp=S.cap?S.capSize*1.9:0,H=T+cp,c=q+n/2,hasL=S.logo||S.ltext,ls=n*S.lsize/100,hw=ls+2*S.lpad;
 const eye=(x,y)=>(x<7&&y<7)||(x>=n-7&&y<7)||(x<7&&y>=n-7);
 const hole=(x,y)=>{if(!hasL)return false;const dx=x+.5+q-c,dy=y+.5+q-c;return S.lshape==='circle'?dx*dx+dy*dy<hw*hw/4:Math.max(Math.abs(dx),Math.abs(dy))<hw/2};
 const on=(x,y)=>x>=0&&y>=0&&x<n&&y<n&&m[y][x]&&!eye(x,y)&&!hole(x,y);
 const gdef=(id,mode,cl,ang)=>{if(mode==='solid'||mode==='none'||cl.length<2)return'';const a=ang*Math.PI/180,h=T/2,st=cl.map((x,i)=>`<stop offset="${i/(cl.length-1)}" stop-color="${x}"/>`).join('');
  return mode==='radial'?`<radialGradient id="${id}" gradientUnits="userSpaceOnUse" cx="${h}" cy="${h}" r="${T*.72}">${st}</radialGradient>`
  :`<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${h-Math.cos(a)*h}" y1="${h-Math.sin(a)*h}" x2="${h+Math.cos(a)*h}" y2="${h+Math.sin(a)*h}">${st}</linearGradient>`};
 const fl=(id,mode,cl)=>mode==='none'?'none':mode==='solid'||cl.length<2?cl[0]:`url(#${id})`;
 const FF=fl('gf',S.fgm,S.fg),BF=fl('gb',S.bgm,S.bg),t=S.shape;let d='';
 for(let y=0;y<n;y++)for(let x=0;x<n;x++){if(!on(x,y))continue;
  const s=t==='liquid'?1:S.msize*(1-S.rand*.6*rn(y*n+x)),o=(1-s)/2,X=x+q+o,Y=y+q+o,cx=x+q+.5,cy=y+q+.5,R=S.round*.5*s;
  if(t==='square')d+=rp(X,Y,s,s,[0,0,0,0]);
  else if(t==='rounded')d+=rp(X,Y,s,s,[R,R,R,R]);
  else if(t==='liquid'){const u=on(x,y-1),r=on(x+1,y),b=on(x,y+1),l=on(x-1,y),k=S.round*.5;d+=rp(x+q,y+q,1,1,[!u&&!l?k:0,!u&&!r?k:0,!b&&!r?k:0,!b&&!l?k:0])}
  else if(t==='circle')d+=circ(cx,cy,s/2);
  else if(t==='diamond')d+=poly([[cx,cy-s*.6],[cx+s*.6,cy],[cx,cy+s*.6],[cx-s*.6,cy]]);
  else if(t==='plus'){const a=s*.55,k=a*.38;d+=poly([[-k,-a],[k,-a],[k,-k],[a,-k],[a,k],[k,k],[k,a],[-k,a],[-k,k],[-a,k],[-a,-k],[-k,-k]].map(p=>[cx+p[0],cy+p[1]]))}
  else if(t==='star'){const a=s*.62;d+=poly(Array.from({length:10},(_,i)=>{const g=-Math.PI/2+i*Math.PI/5,k=i%2?a*.45:a;return[cx+Math.cos(g)*k,cy+Math.sin(g)*k]}))}
  else if(t==='hbars')d+=rp(x+q,Y,1,s,[R,R,R,R].map(z=>Math.min(z,s/2)));
  else d+=rp(X,y+q,s,1,[R,R,R,R].map(z=>Math.min(z,s/2)))}
 let o=`<defs>${gdef('gf',S.fgm,S.fg,S.fga)}${gdef('gb',S.bgm,S.bg,S.bga)}`;
 if(hasL&&S.lclip)o+=`<clipPath id="lc">${S.lshape==='circle'?`<circle cx="${c}" cy="${c}" r="${ls/2}"/>`:`<rect x="${c-ls/2}" y="${c-ls/2}" width="${ls}" height="${ls}" rx="${S.lshape==='rounded'?ls*.22:0}"/>`}</clipPath>`;
 o+=`</defs>`;
 if(S.bgm!=='none'||S.bw)o+=`<rect x="${S.bw/2}" y="${S.bw/2}" width="${T-S.bw}" height="${H-S.bw}" rx="${S.brad}" fill="${BF}" stroke="${S.bw?S.bc:'none'}" stroke-width="${S.bw}"/>`;
 o+=`<path d="${d}" fill="${FF}"/>`;
 const c1=S.ecs?S.eoc:FF,c2=S.ecs?S.epc:FF;
 [[0,0],[n-7,0],[0,n-7]].forEach(([ex,ey],e)=>{const x=q+ex,y=q+ey,sc=[0,1,3][e];
  o+=`<path fill-rule="evenodd" fill="${c1}" d="${shp(S.eo,x,y,7,S.er,sc)+shp(S.eo,x+1,y+1,5,S.er,sc)}"/><path fill="${c2}" d="${shp(S.ep,x+2,y+2,3,S.er,sc)}"/>`});
 if(hasL){if(S.lshape!=='none')o+=S.lshape==='circle'?`<circle cx="${c}" cy="${c}" r="${hw/2}" fill="${S.lbg}"/>`:`<rect x="${c-hw/2}" y="${c-hw/2}" width="${hw}" height="${hw}" rx="${S.lshape==='rounded'?hw*.22:0}" fill="${S.lbg}"/>`;
  if(S.logo)o+=`<image href="${S.logo}" x="${c-ls/2}" y="${c-ls/2}" width="${ls}" height="${ls}" preserveAspectRatio="xMidYMid meet"${S.lclip?' clip-path="url(#lc)"':''}/>`;
  if(S.ltext)o+=`<text x="${c}" y="${c}" text-anchor="middle" dominant-baseline="central" font-size="${ls*.7}" fill="${S.lcol}" font-family="system-ui,sans-serif" font-weight="700">${esc(S.ltext)}</text>`}
 if(S.cap)o+=`<text x="${T/2}" y="${T+cp*.5}" text-anchor="middle" dominant-baseline="central" font-size="${S.capSize}" fill="${S.capCol}" font-family="system-ui,sans-serif" font-weight="700">${esc(S.cap)}</text>`;
 const bgl=lum(S.bg[0]),ct=Math.min(...S.fg.map(x=>{const a=lum(x);return(Math.max(a,bgl)+.05)/(Math.min(a,bgl)+.05)}));
 const note=S.bgm==='none'?'transparent bg':ct<3?'⚠ low contrast, may not scan':Math.min(...S.fg.map(lum))>bgl?'⚠ inverted (light on dark), some scanners fail':'contrast OK';
 return{svg:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${T} ${H}">${o}</svg>`,W:T,H,info:`Version ${v} · ${n}×${n} modules · ECC ${L} · ${note}`}}

/* ---------- preview ---------- */
let raf;
function render(){const b=build(),vw=$('#view');
 if(!b){vw.innerHTML='';$('#info').textContent='Text is too long for a QR code';return}
 vw.innerHTML=b.svg;const s=vw.firstChild,st=$('#stage'),a=Math.min((st.clientWidth-40)/b.W,(st.clientHeight-70)/b.H);s.style.width=b.W*a+'px';s.style.height=b.H*a+'px';$('#info').textContent=b.info}
const draw=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(render);try{localStorage.qrStudio=JSON.stringify(S)}catch(e){}};
addEventListener('resize',draw);
const status=x=>{$('#info').textContent=x;setTimeout(draw,2000)};

/* ---------- UI builders ---------- */
const side=$('#side'),syncs=[],syncAll=()=>syncs.forEach(f=>f());
const sec=(x,o)=>{const d=document.createElement('details');d.open=!!o;d.innerHTML=`<summary>${x}</summary>`;side.append(d);return d};
const row=(d,l,...e)=>{const r=document.createElement('div');r.className='r';if(l)r.innerHTML=`<label>${l}</label>`;r.append(...e);d.append(r);return r};
const btn=(x,f,c)=>{const b=document.createElement('button');b.textContent=x;b.onclick=f;if(c)b.className=c;return b};
const sl=(d,k,l,mi,ma,st=1)=>{const i=document.createElement('input'),o=document.createElement('output');Object.assign(i,{type:'range',min:mi,max:ma,step:st});
 i.oninput=()=>{S[k]=+i.value;o.textContent=i.value;draw()};syncs.push(()=>{i.value=S[k];o.textContent=S[k]});row(d,l,i,o)};
const sel=(d,k,l,opts)=>{const s=document.createElement('select');s.innerHTML=opts.map(o=>{const[v,t]=o.split('|');return`<option value="${v}">${t||v}</option>`}).join('');
 s.onchange=()=>{S[k]=s.value;draw()};syncs.push(()=>s.value=S[k]);row(d,l,s)};
const chk=(d,k,l)=>{const i=document.createElement('input');i.type='checkbox';i.onchange=()=>{S[k]=i.checked;draw()};syncs.push(()=>i.checked=S[k]);row(d,l,i)};

const txt=(d,k,l,ta)=>{const i=document.createElement(ta?'textarea':'input');if(ta)i.rows=3;else i.type='text';i.oninput=()=>{S[k]=i.value;draw()};syncs.push(()=>i.value=S[k]);row(d,l,i)};
const num=(k,mi,ma)=>{const i=document.createElement('input');Object.assign(i,{type:'number',min:mi,max:ma});i.style.width='90px';
 i.onchange=()=>{S[k]=Math.min(ma,Math.max(mi,+i.value|0));i.value=S[k];draw()};syncs.push(()=>i.value=S[k]);return i};
const cols=(d,k,max)=>{const w=document.createElement('div');w.className='sw';d.append(w);
 syncs.push(function bl(){w.innerHTML='';S[k].forEach((c,i)=>{const s=document.createElement('span'),n=document.createElement('input'),x=document.createElement('b');
  n.type='color';n.value=c;n.oninput=()=>{S[k][i]=n.value;draw()};x.textContent='×';x.title='Remove';x.onclick=()=>{if(S[k].length>1){S[k].splice(i,1);bl();draw()}};s.append(n,x);w.append(s)});
  if(S[k].length<max)w.append(btn('+ Add',()=>{S[k].push(S[k][S[k].length-1]);bl();draw()}))})};

/* Presets */
const ST={Classic:{shape:'square',msize:1,eo:'square',ep:'square',fgm:'solid',fg:['#000000'],bg:['#ffffff'],brad:0},
Dots:{shape:'circle',msize:.85,eo:'circle',ep:'circle',fgm:'solid',fg:['#111827'],bg:['#ffffff']},

Stars:{shape:'star',msize:.9,eo:'rounded',ep:'diamond',fgm:'linear',fg:['#0a3d62','#0ea5e9'],bg:['#f0f9ff']},

let d=sec('Style presets',1);
const ps=document.createElement('select');ps.innerHTML='<option value="">Choose a preset…</option>'+Object.keys(ST).map(k=>`<option>${k}</option>`).join('');
ps.onchange=()=>{if(ps.value){Object.assign(S,{round:.6,er:.45,rand:0,msize:1,brad:2,ecs:false,bgm:'solid',fg:['#000000']},JSON.parse(JSON.stringify(ST[ps.value])));ps.value='';syncAll();draw()}};row(d,'Presets',ps);

d=sec('Content',1);txt(d,'text','Text / URL',1);
const TP={'':'Template…',WiFi:'WIFI:T:WPA;S:NetworkName;P:Password;;',Email:'mailto:name@example.com?subject=Hello',Phone:'tel:+43123456789',SMS:'SMSTO:+43123456789:Hello',Location:'geo:48.2082,16.3738',vCard:'BEGIN:VCARD\nVERSION:3.0\nFN:Name\nTEL:+43123456789\nEMAIL:name@example.com\nEND:VCARD'};
const ts=document.createElement('select');ts.innerHTML=Object.keys(TP).map(k=>`<option value="${k}">${k||'Template…'}</option>`).join('');
ts.onchange=()=>{if(ts.value){S.text=TP[ts.value];ts.value='';syncAll();draw()}};row(d,'Templates',ts);
sel(d,'ecc','Error correction',['auto|Auto (H with logo)','L|L · 7%','M|M · 15%','Q|Q · 25%','H|H · 30%']);sl(d,'quiet','Quiet zone',0,10);

/* Modules */
d=sec('Modules (dots)',1);sel(d,'shape','Shape',['square','rounded','liquid|liquid (connected)','circle','diamond','plus','star','hbars|horizontal bars','vbars|vertical bars']);
sl(d,'msize','Size',.3,1,.01);sl(d,'round','Roundness',0,1,.01);sl(d,'rand','Random size',0,1,.01);row(d,'Seed',num('seed',0,9999),btn('New',()=>{S.seed=ri(0,999);syncAll();draw()}));

/* Eyes */

/* Logo */
d=sec('Logo / centre');const fi=document.createElement('input');fi.type='file';fi.accept='image/*';fi.hidden=true;
fi.onchange=()=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,512/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;
 c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.logo=c.toDataURL('image/png');draw()};im.src=r.result};r.readAsDataURL(fi.files[0]);fi.value=''};
row(d,'Image',btn('Upload…',()=>fi.click(),'p'),btn('Remove',()=>{S.logo='';draw()}),fi);txt(d,'ltext','Or text / emoji');col(d,'lcol','Text colour');
sl(d,'lsize','Logo size %',5,35);sl(d,'lpad','Padding',0,4,.1);sel(d,'lshape','Backing shape',['rounded','circle','square','none']);col(d,'lbg','Backing colour');chk(d,'lclip','Clip image to shape');

/* Frame */

txt(d,'cap','Caption');sl(d,'capSize','Caption size',1,6,.1);col(d,'capCol','Caption colour');

/* Export */
d=sec('Export & settings',1);sel(d,'fmt','Format',['png','jpeg','webp','svg']);row(d,'Width (px)',num('px',64,8192));sl(d,'q','Quality',10,100);
const MIME={png:'image/png',jpeg:'image/jpeg',webp:'image/webp'};
function dl(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5e3)}
function exp(copy){const b=build();if(!b)return status('Nothing to export');
 if(!copy&&S.fmt==='svg')return dl(new Blob([b.svg],{type:'image/svg+xml'}),'qr.svg');
 const px=S.px,h=Math.round(px*b.H/b.W),im=new Image();
 im.onload=()=>{const c=document.createElement('canvas');c.width=px;c.height=h;const x=c.getContext('2d');if(S.fmt==='jpeg'&&!copy){x.fillStyle='#fff';x.fillRect(0,0,px,h)}x.drawImage(im,0,0,px,h);
  const ty=copy?MIME.png:MIME[S.fmt];c.toBlob(bl=>{if(!bl)return status('Export failed (size too large?)');
   if(copy)navigator.clipboard.write([new ClipboardItem({[ty]:bl})]).then(()=>status('Copied'),()=>status('Clipboard blocked'));
   else{dl(bl,`qr-${px}px.${S.fmt==='jpeg'?'jpg':S.fmt}`);status('Saved')}},ty,S.q/100)};
 im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(b.svg.replace('<svg ',`<svg width="${px}" height="${h}" `))}
const fj=document.createElement('input');fj.type='file';fj.accept='.json';fj.hidden=true;
fj.onchange=async()=>{try{Object.assign(S,JSON.parse(await fj.files[0].text()));syncAll();draw()}catch(e){status('Invalid file')}fj.value=''};
row(d,'',btn('Download',()=>exp(),'p'),btn('Copy PNG',()=>exp(true)),btn('Copy SVG',()=>{const b=build();b&&navigator.clipboard.writeText(b.svg).then(()=>status('SVG copied'))}));
row(d,'',btn('Save settings',()=>dl(new Blob([JSON.stringify(S)],{type:'application/json'}),'qr-settings.json')),btn('Load',()=>fj.click()),btn('Reset',()=>{S=JSON.parse(JSON.stringify(D));syncAll();draw()}),fj);

 eo:pk(['square','rounded','circle','leaf','diamond']),ep:pk(['square','rounded','circle','leaf','diamond']),er:rnd(.2,.9),fgm:pk(['solid','linear','radial']),
 fg:[hsl(h,rnd(60,90),rnd(14,30)),hsl(h+rnd(30,90),rnd(60,90),rnd(24,40))],fga:ri(0,360),bgm:'solid',bg:[hsl(h,rnd(20,60),rnd(94,98))],ecs:false,seed:ri(1,99)});
 Object.keys(S).forEach(k=>typeof S[k]==='number'&&(S[k]=Math.round(S[k]*100)/100));syncAll();draw()}
$('#ra').onclick=rStyle;$('#dlb').onclick=()=>exp();
syncAll();draw();
